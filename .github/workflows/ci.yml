name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# 最小権限。ソースの読み取りのみで足りる
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 配信先が変わっても内部リンクが壊れないことを、実際の生成物で確かめる。
      # サブパス配信（GitHub Pages の既定）とドメイン直下配信（カスタムドメイン移行後）の両方を見る。
      - name: Build (base=/vision-products)
        run: pnpm build

      - name: Check dist links (base=/vision-products)
        run: node scripts/check-dist-links.mjs --dist dist --base /vision-products

      - name: Build (base=/)
        env:
          BASE_PATH: "/"
        run: pnpm build

      - name: Check dist links (base=/)
        run: node scripts/check-dist-links.mjs --dist dist --base /

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      # .astro の整形には prettier-plugin-astro が要る。npx の都度取得では
      # プラグインを解決できないため、devDependencies を入れてから検査する。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 検査対象の拡張子は package.json の format:check が持つ。CI も README も
      # 手元も同じ script を呼ぶことで、片方だけ広げた食い違いが起きないようにする。
      - name: Check formatting
        run: |
          if ! pnpm run format:check; then
            echo "::error title=Format Check::Prettier の整形に違反があります。README「フォーマット」の pnpm run format を実行して差分をコミットしてください。"
            exit 1
          fi
          echo "=== Format Check OK ==="

  issue-check:
    name: Issue Check
    # push では PR 本文が存在しないため PR のときだけ実行する
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check issue linking
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Closes #N, Fixes #N, Resolves #N のいずれかがあるか
          if echo "$PR_BODY" | grep -qiE "(closes|fixes|resolves)\s+#[0-9]+"; then
            echo "=== Issue 紐づけチェック OK ==="
            exit 0
          fi

          # override:no-issue ラベルがあればスキップ
          if echo "$PR_LABELS" | grep -q "override:no-issue"; then
            echo ""
            echo "::notice::override:no-issue ラベルにより Issue 紐づけチェックをスキップ"
            exit 0
          fi

          echo ""
          echo "::error::PR 本文に Issue 紐づけ（Closes #N）がありません。"
          echo "PR 本文に 'Closes #N' を追加してください。"
          echo "Issue がない場合は先に Issue を作成してください。"
          echo "やむを得ない場合は PR に 'override:no-issue' ラベルを付けてください。"
          exit 1
