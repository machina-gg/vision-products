name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# 最小権限。ソースの読み取りのみで足りる
permissions:
  contents: read

# 同一 PR に連続 push したとき、古い run を取り消す。
# group は pull_request なら refs/pull/<N>/merge、push なら refs/heads/develop になるので
# PR の run と develop の run は別グループになり、互いを取り消すことはない。
# cancel-in-progress を pull_request に限るのは、マージ直後の develop の検証を
# 途中で消さないため（group の切り方だけに頼らず、条件でも二重に守る）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 配信先が変わっても内部リンクが壊れないことを、実際の生成物で確かめる。
      # サブパス配信（GitHub Pages の既定）とドメイン直下配信（カスタムドメイン移行後）の両方を見る。
      - name: Build (base=/vision-products)
        run: pnpm build

      - name: Check dist links (base=/vision-products)
        run: node scripts/check-dist-links.mjs --dist dist --base /vision-products

      - name: Build (base=/)
        env:
          BASE_PATH: "/"
        run: pnpm build

      - name: Check dist links (base=/)
        run: node scripts/check-dist-links.mjs --dist dist --base /

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      # .astro の整形には prettier-plugin-astro が要る。npx の都度取得では
      # プラグインを解決できないため、devDependencies を入れてから検査する。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 検査対象の拡張子は package.json の format:check が持つ。CI も README も
      # 手元も同じ script を呼ぶことで、片方だけ広げた食い違いが起きないようにする。
      - name: Check formatting
        run: |
          if ! pnpm run format:check; then
            echo "::error title=Format Check::Prettier の整形に違反があります。README「フォーマット」の pnpm run format を実行して差分をコミットしてください。"
            exit 1
          fi
          echo "=== Format Check OK ==="

  issue-check:
    name: Issue Check
    # push では PR 本文が存在しないため PR のときだけ実行する。
    # base が main の PR はリリース PR（develop → main）で、開発の PR と違い
    # もともと Issue に紐づかない種類の PR なので、この検査の対象から外す。
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest

    steps:
      # ⚠ 判定ロジックはここに書かない。実体は共有リポジトリの composite action にある
      #   （同じ検査を各リポジトリで実装するとズレるため）。
      #   ラベルは JSON 配列で渡す（action 側が要素の完全一致で判定するため、カンマ連結は不可）。
      - name: Check issue linking
        id: issue-link-check
        uses: machina-gg/agent-review/.github/actions/issue-link-check@main
        with:
          pr-body: ${{ github.event.pull_request.body }}
          labels-json: ${{ toJSON(github.event.pull_request.labels.*.name) }}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      # astro check は @astrojs/check と typescript を使う。どちらも devDependencies。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 検査の設定は tsconfig.json が持つ。CI も README も手元も同じ script を
      # 呼ぶことで、片方だけ広げた食い違いが起きないようにする。
      - name: Check types
        run: |
          if ! pnpm run type-check; then
            echo "::error title=Type Check::型エラーがあります。README「型チェック」の pnpm run type-check を手元で実行して解消してください。"
            exit 1
          fi
          echo "=== Type Check OK ==="
