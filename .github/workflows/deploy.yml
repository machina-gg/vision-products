name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pages の実際の配信先を取得する。カスタムドメインを設定すると origin が
      # そのドメインに、base_path が空文字（＝ドメイン直下）に変わるため、
      # コードを変えずに次のデプロイから base が切り替わる。
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠ withastro/action はビルドへ環境変数を渡す入力を持たないため、
      #   配信先を渡せるよう ci.yml と同じ素のステップで組み立てる（#95 と重なる範囲）
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # base_path はカスタムドメイン時に空文字になる。空文字の環境変数が
          # 渡るかどうかに依存しないよう、式の側で "/"（ドメイン直下）へ倒す
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
